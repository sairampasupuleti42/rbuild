<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>rBuild - Indian Building Construction Estimator</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Upload a text-readable house plan to estimate built-up area and construction quantities, then add local supplier rates for a project budget.">
  <meta name="theme-color" content="#09151f">
  <link rel="manifest" href="manifest.webmanifest">
  <!-- Tailwind CSS via CDN for instant, responsive styling -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="app-body">
  <app-root></app-root>
  <footer class="app-footer">
    Build / deployment time:
    <time id="deployment-time">__BUILD_TIMESTAMP__</time>
    IST
  </footer>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js').then((registration) => {
        const notifyUpdateReady = (worker) => {
          if (worker && navigator.serviceWorker.controller) {
            sessionStorage.setItem('rbuild-update-ready', 'true');
            window.dispatchEvent(new CustomEvent('rbuild-update-ready'));
          }
        };

        notifyUpdateReady(registration.waiting);
        registration.addEventListener('updatefound', () => {
          const worker = registration.installing;
          worker?.addEventListener('statechange', () => {
            if (worker.state === 'installed') {
              notifyUpdateReady(worker);
            }
          });
        });

        navigator.serviceWorker.addEventListener('controllerchange', () => {
          window.location.reload();
        });

        const updateTimer = window.setInterval(() => {
          registration.update().catch(console.error);
        }, 15 * 60 * 1000);
        window.addEventListener('beforeunload', () => window.clearInterval(updateTimer));
      }).catch(console.error);
    }
  </script>
</body>
</html>
