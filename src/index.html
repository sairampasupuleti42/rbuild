<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>rBuild - Indian Building Construction Estimator</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#0284c7">
  <link rel="manifest" href="manifest.webmanifest">
  <!-- Tailwind CSS via CDN for instant, responsive styling -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 antialiased selection:bg-sky-500 selection:text-white">
  <app-root></app-root>
  <footer class="py-3 text-center text-xs text-slate-500">
    Build / deployment time:
    <time id="deployment-time">__BUILD_TIMESTAMP__</time>
    IST
  </footer>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(console.error);
    }
  </script>
</body>
</html>
