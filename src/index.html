<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>rBuild - Indian Building Construction Estimator</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#09151f">
  <link rel="manifest" href="manifest.webmanifest">
  <!-- Tailwind CSS via CDN for instant, responsive styling -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="app-body">
  <app-root></app-root>
  <footer class="app-footer">
    Build / deployment time:
    <time id="deployment-time">__BUILD_TIMESTAMP__</time>
    IST
  </footer>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(console.error);
    }
  </script>
</body>
</html>
